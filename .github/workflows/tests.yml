name: Tests
on: [push, pull_request]

jobs:
  core-and-editor:
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon-x11-0
      - run: python -m pip install -e '.[gui,dev]'
      - run: python -m pytest -q
      - run: python -m build

  fortress:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Fortress from official packages
        run: |
          sudo apt-get update
          sudo apt-get install -y curl gnupg lsb-release python3-venv xvfb libgl1-mesa-dri
          curl -fsSL https://packages.osrfoundation.org/gazebo.gpg | sudo gpg --dearmor -o /usr/share/keyrings/gazebo-archive-keyring.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/gazebo-archive-keyring.gpg] https://packages.osrfoundation.org/gazebo/ubuntu-stable $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/gazebo-stable.list
          sudo apt-get update
          sudo apt-get install -y ignition-fortress
      - run: python3 -m venv .venv && .venv/bin/pip install -e .
      - name: Native validation, loading and physical contact
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: softpipe
        run: xvfb-run -a .venv/bin/python scripts/verify_fortress.py
