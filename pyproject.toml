[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gazeboarena"
version = "0.1.0"
description = "Gazebo Fortress terrain and scene editor for robot policy validation"
readme = "README_en.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "GazeboArena contributors"}]
dependencies = []

[project.optional-dependencies]
gui = ["PySide6>=6.8,<6.9"]
dev = ["pytest>=8,<9", "build>=1,<2"]

[project.scripts]
gazeboarena = "gazeboarena.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gazeboarena = ["data/*.sdf", "data/*.config", "data/rescue_assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
